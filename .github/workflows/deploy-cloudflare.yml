# Deploys visitplane.com to Cloudflare Workers on every push to main.
# Restores the "push = live" pipeline (previously handled by Vercel).
#
# Requires repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN         — scoped token (Edit Cloudflare Workers template).
#     See the PR/commit description that introduced this workflow for the
#     exact token-creation steps.
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY — NOT covered by
#     `wrangler secret put`. Server-only secrets (service-role key, Resend,
#     etc.) live on the Worker at runtime and persist across deploys without
#     CI re-supplying them — but NEXT_PUBLIC_* vars are inlined into the
#     client JS bundle by `npm run cf:build` itself, so they must be present
#     in THIS job's environment during the build step or the homepage ships
#     a client bundle with `supabaseUrl: undefined`, throwing "supabaseUrl is
#     required." for real visitors (see app/error.tsx capture in error_log,
#     and the postmortem in the commit that added these lines).
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1068890dae6e2dde22dd81bdbf199830
          command: deploy
