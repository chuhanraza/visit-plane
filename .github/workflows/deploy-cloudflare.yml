# Deploys visitplane.com to Cloudflare Workers on every push to main.
# Restores the "push = live" pipeline (previously handled by Vercel).
#
# Requires one repo secret (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — scoped token (Edit Cloudflare Workers template).
#     See the PR/commit description that introduced this workflow for the
#     exact token-creation steps.
#
# Does NOT need Supabase/Resend/etc secrets — those were already pushed to
# the Worker itself via `wrangler secret put` and persist across deploys
# without being re-supplied by CI.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1068890dae6e2dde22dd81bdbf199830
          command: deploy
